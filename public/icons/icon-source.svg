<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3ab4f2"/>
      <stop offset="100%" stop-color="#0a6db5"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d7fcb"/>
      <stop offset="100%" stop-color="#085fa0"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0b6db8"/>
      <stop offset="100%" stop-color="#074e87"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Waves at bottom -->
  <g clip-path="url(#rounded)">
    <path d="M-10 370 Q60 330 130 360 Q200 390 270 355 Q340 320 410 350 Q480 380 530 355 L530 512 L-10 512 Z"
          fill="url(#wave1)" opacity="0.85"/>
    <path d="M-10 400 Q70 365 150 395 Q230 425 310 390 Q390 355 470 385 Q510 400 530 395 L530 512 L-10 512 Z"
          fill="url(#wave2)" opacity="0.9"/>
  </g>

  <!-- Fishing line from top-right to hook -->
  <line x1="370" y1="60" x2="345" y2="175" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Hook -->
  <g transform="translate(340,170)" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hook shaft + curve -->
    <path d="M5 5 L5 45 Q5 80 35 80 Q65 80 65 52 Q65 40 55 35"/>
    <!-- Barb -->
    <path d="M55 35 L40 42"/>
    <!-- Eye/ring at top -->
    <circle cx="5" cy="5" r="8" stroke-width="5"/>
  </g>

  <!-- Fish body — jumping up-left, mouth open toward hook -->
  <g fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- Main body outline -->
    <path d="
      M 320 155
      C 310 105, 270 65, 225 58
      C 175 50, 130 70, 105 105
      C 80 140, 80 185, 100 220
      C 120 255, 160 275, 205 272
      C 240 270, 270 255, 295 232
      C 318 210, 325 180, 320 155
      Z
    "/>

    <!-- Open mouth (gap in body top-right) -->
    <path d="M 320 155 C 335 140, 352 138, 360 148"/>
    <path d="M 295 132 C 310 115, 338 118, 348 132"/>

    <!-- Tail fin (bottom-left, forked) -->
    <path d="M 105 105 C 75 85, 42 55, 30 30"/>
    <path d="M 100 220 C 68 240, 35 265, 25 295"/>
    <path d="M 30 30 C 40 60, 38 90, 25 295" fill="none"/>

    <!-- Dorsal fin (top of body) -->
    <path d="M 175 58 C 168 30, 190 10, 215 12 C 240 14, 258 35, 260 58"/>

    <!-- Pectoral fin (mid body, lower) -->
    <path d="M 185 230 C 165 258, 142 268, 125 260 C 145 245, 158 228, 168 215"/>

    <!-- Eye -->
    <circle cx="265" cy="130" r="14" stroke-width="7"/>
    <circle cx="265" cy="130" r="5" fill="white"/>

    <!-- Gill line -->
    <path d="M 240 90 C 235 125, 238 165, 245 195" stroke-width="5" opacity="0.7"/>

    <!-- Body detail line (lateral line) -->
    <path d="M 215 270 C 235 258, 265 235, 285 205" stroke-width="4" opacity="0.5"/>
  </g>
</svg>
